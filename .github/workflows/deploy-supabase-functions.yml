name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Missing SUPABASE_PROJECT_ID"; exit 1; }

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Deploy telegram-auth
        run: supabase functions deploy telegram-auth --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy telegram-session
        run: supabase functions deploy telegram-session --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy player-bootstrap
        run: supabase functions deploy player-bootstrap --project-ref "$SUPABASE_PROJECT_ID"
